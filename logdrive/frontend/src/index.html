<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LogDrive Highway</title>
  <link rel="stylesheet" href="/runtime.css" />
</head>
<body>
  <canvas id="highway"></canvas>
  <!-- Minimal top‑bar HUD -->
  <div id="hud">
    <span id="metrics"></span>
    <span id="replay-controls" style="display:none;">
      <button id="replay-toggle">Replay</button>
      <input type="range" id="replay-speed" min="0.5" max="4" step="0.5" value="1" />
      <span id="replay-position">0/0</span>
    </span>
  </div>
  <!-- Inspector overlay -->
  <div id="inspector"><span class="close">&times;</span></div>
  <!-- Timeline canvas (kept at bottom, subtle) -->
  <div id="timeline-container">
    <canvas id="timeline-canvas"></canvas>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
